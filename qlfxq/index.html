<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf3f4">
<title>飞行棋 · 恋爱版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>💗</text></svg>">
<style>
:root{
  --c-blue:#a9d3ef;  --c-pink:#f7bccd;  --c-yellow:#f9e39b;  --c-cream:#f7efdf;
  --c-teal:#c3e6df;  --c-green:#cfe9c4; --c-peach:#fbdcc6;  --c-lav:#e2dcf4;  --c-gray:#e9e9f0;
  --ink:#4b4450; --ink-2:#8b8291;
  --blue-d:#3f83b8; --pink-d:#d0688c;
  --shadow:0 18px 40px -20px rgba(122,88,112,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(1100px 620px at 6% -12%, #ffe7ee 0%, rgba(255,231,238,0) 58%),
    radial-gradient(900px 520px at 102% -6%, #e4effb 0%, rgba(228,239,251,0) 55%),
    radial-gradient(900px 600px at 50% 118%, #fdeef1 0%, rgba(253,238,241,0) 60%),
    linear-gradient(180deg,#fffbfc 0%,#f8f9fd 46%,#fdf3f5 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  touch-action:manipulation;
}
.float-heart{position:fixed;font-size:16px;opacity:.20;pointer-events:none;z-index:0;animation:floatUp linear infinite;filter:blur(.2px)}
@keyframes floatUp{
  0%{transform:translateY(14vh) scale(.8) rotate(-8deg);opacity:0}
  18%{opacity:.22}
  82%{opacity:.18}
  100%{transform:translateY(-96vh) scale(1.15) rotate(10deg);opacity:0}
}

.wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}

/* ---------- header ---------- */
.hdr{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;margin:2px 0 12px}
.hdr h1{
  margin:0;font-size:clamp(19px,2.4vw,27px);letter-spacing:2px;font-weight:800;
  background:linear-gradient(92deg,#e2749a,#a97bd0 55%,#5b9bd5);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hdr .sub{margin:0;font-size:11px;color:var(--ink-2);letter-spacing:1.2px}

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.boardWrap{display:flex;justify-content:center;min-width:0}

/* ---------- board ---------- */
.board{
  position:relative;display:grid;
  grid-template-columns:repeat(var(--cols,11),minmax(0,1fr));
  grid-template-rows:repeat(var(--rows,9),minmax(0,1fr));
  gap:var(--gap,3px);padding:var(--pad,10px);
  border-radius:24px;
  background:
    linear-gradient(180deg,#fffdfc 0%,#fff8fa 100%);
  border:1px solid #f2e6ec;
  box-shadow:var(--shadow), inset 0 0 0 3px #fff, inset 0 0 0 4px #f7e7ee;
  isolation:isolate;
}
.board::after{
  content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.7),rgba(255,255,255,0) 45%);
}

/* ---------- cells ---------- */
.cell{
  position:relative;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--cell,40px) * .085);
  border-radius:calc(var(--cell,40px) * .15);
  border:1px solid rgba(255,255,255,.92);
  box-shadow:0 1px 2px rgba(120,95,115,.10), inset 0 1px 0 rgba(255,255,255,.8);
  font-size:calc(var(--cell,40px) * .19 * var(--fz,1));
  line-height:1.2;font-weight:500;letter-spacing:.2px;
  text-align:center;color:#544c58;overflow:hidden;
  cursor:pointer;user-select:none;
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
  animation:cellIn .45s cubic-bezier(.22,1,.36,1) backwards;
}
@keyframes cellIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
.cell:hover{transform:translateY(-1.5px);box-shadow:0 4px 10px -4px rgba(120,95,115,.35), inset 0 1px 0 rgba(255,255,255,.85);z-index:2}
.cell:active{transform:scale(.95)}
.cell .no{
  position:absolute;top:calc(var(--cell,40px) * .02);left:calc(var(--cell,40px) * .08);
  font-size:calc(var(--cell,40px) * .13);font-weight:800;opacity:.32;line-height:1;letter-spacing:0;
}
.cell.hit{animation:hit .5s ease}
@keyframes hit{0%{box-shadow:0 0 0 0 rgba(255,150,180,.9)}100%{box-shadow:0 0 0 12px rgba(255,150,180,0)}}

.board.narrow .cell{font-size:calc(var(--cell,40px) * .2 * var(--fz,1));padding:calc(var(--cell,40px) * .1) calc(var(--cell,40px) * .05)}
.board.narrow .cell .no{font-size:calc(var(--cell,40px) * .16);opacity:.28}

.cell .flag{position:absolute;right:5%;top:3%;font-size:calc(var(--cell,40px) * .24);line-height:1;opacity:.85;filter:saturate(1.1)}
.t-short{display:none}
.board.narrow .t-short{display:inline}
.board.narrow .t-full{display:none}

/* ---------- center panels ---------- */
.cLegend,.cIllus,.cMain,.cFoot{position:relative;z-index:1;min-width:0;min-height:0;pointer-events:none}
.board.wide .cLegend{grid-area:2/2/3/11}
.board.wide .cIllus{grid-area:3/2/8/5}
.board.wide .cMain{grid-area:4/6/7/11}
.board.wide .cFoot{grid-area:8/2/9/11}
.board.narrow .cLegend{grid-area:2/3/4/8}
.board.narrow .cIllus{grid-area:4/3/7/8}
.board.narrow .cMain{grid-area:7/3/11/8}
.board.narrow .cFoot{display:none}

.cIllus{display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:18px}
.cIllus img{width:100%;height:100%;object-fit:cover;object-position:55% 38%;border-radius:18px;
  -webkit-mask-image:radial-gradient(115% 105% at 50% 45%,#000 56%,transparent 100%);
  mask-image:radial-gradient(115% 105% at 50% 45%,#000 56%,transparent 100%);}
.board.narrow .cIllus{border-radius:14px}
.board.narrow .cIllus img{border-radius:14px;object-position:55% 32%}

.cMain{
  display:flex;flex-direction:column;justify-content:center;gap:6px;
  padding:2% 4%;text-align:left;
}
.cTitle{
  font-size:clamp(15px,1.55vw,21px);font-weight:800;letter-spacing:1.5px;
  background:linear-gradient(92deg,#df6d94,#a879cf 60%,#5b9bd5);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.cSub{font-size:clamp(9px,.78vw,11px);color:#b08c9c;letter-spacing:.6px}
.cRules{margin:2px 0 0;font-size:clamp(9.5px,.92vw,12.5px);line-height:1.62;color:#6d6470;
  overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:9}
.cRules b{color:#c9698f;font-weight:700}
.board.narrow .cMain{padding:0 2%;gap:3px}
.board.narrow .cTitle{font-size:11px}
.board.narrow .cSub{font-size:8px}
.board.narrow .cRules{font-size:8.6px;line-height:1.5;-webkit-line-clamp:8}

.cLegend{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;font-size:clamp(8.5px,.85vw,11.5px);color:#8a8190}
.board.narrow .cLegend{font-size:8px;gap:3px 7px}
.lg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 1px rgba(0,0,0,.06)}
.board.narrow .dot{width:7px;height:7px;border-radius:2px}

.cFoot{display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:clamp(9px,.9vw,12px);color:#a294a0;line-height:1.5;padding:0 6%}

/* ---------- pieces ---------- */
.piece{
  position:absolute;width:calc(var(--cell,40px) * .58);height:calc(var(--cell,40px) * .58);
  border-radius:50%;transform:translate(-50%,-50%);z-index:6;
  display:grid;place-items:center;color:#fff;font-weight:800;
  font-size:calc(var(--cell,40px) * .26);line-height:1;
  transition:left .19s cubic-bezier(.4,1.6,.5,1),top .19s cubic-bezier(.4,1.6,.5,1);
  box-shadow:0 2px 4px rgba(60,40,60,.28), inset 0 1px 2px rgba(255,255,255,.65);
  pointer-events:none;
}
.piece::after{
  content:"";position:absolute;inset:-14%;border-radius:50%;
  border:2px solid rgba(255,255,255,.85);
}
.piece.blue{background:radial-gradient(circle at 34% 28%,#9ccdf0,#4a8ec2 62%,#31719f);}
.piece.pink{background:radial-gradient(circle at 34% 28%,#ffc0d2,#e5809f 62%,#c25b7e);}
.piece.bump{animation:bump .3s ease}
@keyframes bump{0%{transform:translate(-50%,-50%) scale(1)}45%{transform:translate(-50%,-58%) scale(1.16)}100%{transform:translate(-50%,-50%) scale(1)}}

/* ---------- panel ---------- */
.panel{display:flex;flex-direction:column;gap:10px}
.turnBar{
  display:flex;align-items:center;gap:8px;justify-content:center;
  padding:9px 14px;border-radius:14px;background:rgba(255,255,255,.78);
  border:1px solid #f3e6ec;box-shadow:0 6px 16px -12px rgba(120,90,120,.6);
  font-size:13px;font-weight:700;letter-spacing:.5px;color:#6b6172;backdrop-filter:blur(6px);
}
.turnBar .tdot{width:9px;height:9px;border-radius:50%;transition:background .25s}
.turnBar.b .tdot{background:#4a8ec2;box-shadow:0 0 0 4px rgba(74,142,194,.16)}
.turnBar.p .tdot{background:#e5809f;box-shadow:0 0 0 4px rgba(229,128,159,.16)}

.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:12px 8px 10px;border-radius:18px;cursor:pointer;
  background:rgba(255,255,255,.82);border:1px solid #f2e6ec;
  box-shadow:0 8px 20px -16px rgba(120,90,120,.7);
  transition:box-shadow .25s,border-color .25s,transform .15s,background .25s;
  font-family:inherit;color:inherit;
}
.pcard:hover{transform:translateY(-1px)}
.pcard .pname{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:1px;color:#6b6172}
.pcard .swatch{width:10px;height:10px;border-radius:50%}
.pcard.blue .swatch{background:linear-gradient(150deg,#9ccdf0,#3f7fb3)}
.pcard.pink .swatch{background:linear-gradient(150deg,#ffc0d2,#d5658c)}
.pcard .pmeta{font-size:11px;color:#a396a3;letter-spacing:.5px}
.pcard.active{border-color:#f7d3e0;background:#fff;
  box-shadow:0 12px 26px -16px rgba(214,110,150,.75),0 0 0 3px rgba(255,214,229,.55)}
.pcard.dim{opacity:.62;filter:saturate(.85)}
.pcard.active::before{
  content:"";position:absolute;inset:-2px;border-radius:20px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,190,214,.55),rgba(160,200,240,.45));
  z-index:-1;filter:blur(6px);
}

/* dice */
.die{
  width:58px;height:58px;padding:7px;border-radius:15px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;
  box-shadow:0 8px 14px -8px rgba(60,40,60,.55), inset 0 -4px 8px rgba(0,0,0,.16), inset 0 3px 5px rgba(255,255,255,.55);
  transition:transform .2s;
}
.die.blue{background:linear-gradient(150deg,#9ed1f2,#4a8ec2 65%,#35759f)}
.die.pink{background:linear-gradient(150deg,#ffc3d4,#e5809f 65%,#c65f82)}
.die i{background:#fff;border-radius:50%;opacity:0;transition:opacity .09s;box-shadow:inset 0 -1px 1px rgba(0,0,0,.15)}
.die[data-face="1"] i:nth-child(5),
.die[data-face="2"] i:nth-child(1),.die[data-face="2"] i:nth-child(9),
.die[data-face="3"] i:nth-child(1),.die[data-face="3"] i:nth-child(5),.die[data-face="3"] i:nth-child(9),
.die[data-face="4"] i:nth-child(1),.die[data-face="4"] i:nth-child(3),.die[data-face="4"] i:nth-child(7),.die[data-face="4"] i:nth-child(9),
.die[data-face="5"] i:nth-child(1),.die[data-face="5"] i:nth-child(3),.die[data-face="5"] i:nth-child(5),.die[data-face="5"] i:nth-child(7),.die[data-face="5"] i:nth-child(9),
.die[data-face="6"] i:nth-child(1),.die[data-face="6"] i:nth-child(3),.die[data-face="6"] i:nth-child(4),.die[data-face="6"] i:nth-child(6),.die[data-face="6"] i:nth-child(7),.die[data-face="6"] i:nth-child(9){opacity:1}
.die.rolling{animation:shake .16s linear infinite}
@keyframes shake{
  0%{transform:rotate(0) translateY(0) scale(1)}
  25%{transform:rotate(-9deg) translateY(-3px) scale(1.04)}
  50%{transform:rotate(6deg) translateY(1px) scale(.98)}
  75%{transform:rotate(-4deg) translateY(-2px) scale(1.03)}
  100%{transform:rotate(0) translateY(0) scale(1)}
}

.tips{text-align:center;font-size:11px;color:#b3a5b2;letter-spacing:.6px}
.log{display:flex;flex-direction:column;gap:5px;min-height:0;max-height:88px;overflow:auto;padding-right:2px}
.log::-webkit-scrollbar{width:0}
.log .li{font-size:11px;color:#9b8f9c;line-height:1.4;padding-left:10px;position:relative}
.log .li::before{content:"";position:absolute;left:0;top:6px;width:4px;height:4px;border-radius:50%;background:#e6c9d6}
.btn{
  border:none;border-radius:12px;padding:10px 16px;font-family:inherit;font-size:12.5px;
  font-weight:700;letter-spacing:1px;cursor:pointer;transition:transform .14s,filter .2s;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.8);color:#9a8e9b;border:1px solid #eeE0e7;box-shadow:0 6px 14px -12px rgba(120,90,120,.8)}
.btn.ghost:hover{color:#c9698f;border-color:#f4d4e0}
.btn.primary{background:linear-gradient(135deg,#f3a2bd,#d9759b);color:#fff;box-shadow:0 10px 22px -12px rgba(208,104,140,.9)}

/* ---------- modal ---------- */
.modal{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(70,52,68,.32);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal.show{opacity:1;pointer-events:auto}
.card{
  position:relative;width:min(400px,92vw);background:#fff;border-radius:26px;overflow:hidden;
  box-shadow:0 30px 70px -28px rgba(80,50,75,.65);
  transform:translateY(16px) scale(.96);transition:transform .32s cubic-bezier(.22,1.2,.36,1);
  text-align:center;
}
.modal.show .card{transform:translateY(0) scale(1)}
.card .top{height:8px;width:100%}
.card .body{padding:22px 24px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.card .emo{font-size:40px;line-height:1;filter:drop-shadow(0 6px 10px rgba(200,140,170,.35))}
.card .tag{font-size:11px;letter-spacing:2px;color:#b5a6b2;font-weight:700}
.card .who{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#8b8190}
.card .who .swatch{width:9px;height:9px;border-radius:50%}
.card .txt{font-size:clamp(19px,5vw,23px);font-weight:800;letter-spacing:1.5px;color:#4b4450;line-height:1.4}
.card .extra{font-size:12px;color:#c9698f;font-weight:700;letter-spacing:.5px}
.card .btn{width:100%;margin-top:8px;padding:13px}

/* ---------- win ---------- */
.win{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 50% 40%,rgba(255,248,251,.82),rgba(255,226,238,.9));backdrop-filter:blur(6px)}
.win.show{display:flex}
.winBox{text-align:center;max-width:360px}
.winBox .big{font-size:64px;animation:pop .6s cubic-bezier(.22,1.4,.36,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.winBox h2{margin:10px 0 6px;font-size:26px;letter-spacing:2px;
  background:linear-gradient(92deg,#e2749a,#a97bd0 60%,#5b9bd5);-webkit-background-clip:text;background-clip:text;color:transparent}
.winBox p{margin:0 0 20px;color:#8b8190;font-size:13px;line-height:1.7}
.confetti{position:fixed;top:-40px;font-size:18px;pointer-events:none;z-index:61;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(420deg);opacity:.2}}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  background:rgba(60,45,58,.9);color:#fff;font-size:12.5px;letter-spacing:.5px;
  padding:9px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:all .25s;z-index:70;
  max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (min-width:980px){
  .stage{flex-direction:row;align-items:flex-start;gap:18px}
  .panel{flex:0 0 250px;width:250px;position:sticky;top:16px;padding-top:2px}
  .log{max-height:150px}
  .boardWrap{flex:1 1 auto}
}
@media (max-width:979px){
  .wrap{padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
  .hdr{margin:0 0 6px;flex-direction:column;gap:1px}
  .hdr h1{font-size:19px;letter-spacing:1.5px}
  .hdr .sub{font-size:10px;letter-spacing:.8px}
  .panel{order:2;gap:8px}
  .boardWrap{order:1}
  .pcard{padding:10px 6px 8px;gap:6px}
  .die{width:44px;height:44px;border-radius:11px;padding:5px;gap:2px}
  .pcard{padding:8px 6px 6px;gap:4px}
  .pcard .pname{font-size:11.5px}
  .pcard .pmeta{font-size:10px}
  .log{display:none}
  .turnBar{padding:7px 12px;font-size:12px}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="hdr">
    <h1>飞行棋 · 恋爱版</h1>
    <p class="sub">仅适用于 18 岁以上 · 情侣双人小游戏</p>
  </header>

  <div class="stage">
    <div class="boardWrap" id="boardWrap">
      <div class="board" id="board">
        <div class="cLegend" id="cLegend"></div>
        <div class="cIllus" id="cIllus"><img src="assets/couple.jpg" alt=""></div>
        <div class="cMain" id="cMain">
          <div class="cTitle">飞行棋 · 恋爱版</div>
          <div class="cSub">（仅适用于 18 岁以上）</div>
          <p class="cRules">
            游戏规则：可按棋盘上的准备建议的道具和食材，也可以根据自己的喜好修改表格奖励或惩罚。<br>
            走棋规则：骰子点数大的先走，走到对应格子里的内容为对方做惩罚，福利自己享受。若无法接受格子内容，可自由协商重摇或者做别的惩罚。
          </p>
        </div>
        <div class="cFoot" id="cFoot">💡 轻点任意格子可查看内容 · 遇到无法完成的惩罚，可自由协商更换</div>

        <div class="piece blue" id="pBlue">蓝</div>
        <div class="piece pink" id="pPink">粉</div>
      </div>
    </div>

    <aside class="panel">
      <div class="turnBar b" id="turnBar"><span class="tdot"></span><span id="turnText">轮到 蓝方 掷骰子</span></div>

      <div class="players">
        <button class="pcard blue active" id="cardBlue" data-p="blue" aria-label="蓝方掷骰子">
          <div class="pname"><span class="swatch"></span>蓝方</div>
          <div class="die blue" id="dieBlue" data-face="1"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="pmeta" id="posBlue">第 1 格</div>
        </button>
        <button class="pcard pink dim" id="cardPink" data-p="pink" aria-label="粉方掷骰子">
          <div class="pname"><span class="swatch"></span>粉方</div>
          <div class="die pink" id="diePink" data-face="1"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="pmeta" id="posPink">第 1 格</div>
        </button>
      </div>

      <div class="tips" id="tips">轻点自己的骰子开始 ♥</div>
      <div class="log" id="log"></div>
      <button class="btn ghost" id="reset">重新开始</button>
    </aside>
  </div>
</div>

<div class="modal" id="modal">
  <div class="card">
    <div class="top" id="mTop"></div>
    <div class="body">
      <div class="emo" id="mEmo">💗</div>
      <div class="tag" id="mTag">第 1 格</div>
      <div class="who" id="mWho"><span class="swatch" style="width:9px;height:9px;border-radius:50%;background:#4a8ec2"></span><span></span></div>
      <div class="txt" id="mTxt">拥抱 30 秒</div>
      <div class="extra" id="mExtra"></div>
      <button class="btn primary" id="mBtn">完成 ✓</button>
    </div>
  </div>
</div>

<div class="win" id="win">
  <div class="winBox">
    <div class="big" id="winEmo">🏆</div>
    <h2 id="winTitle">蓝方 到达终点</h2>
    <p id="winDesc">恭喜通关！<br>愿你们的每一格，都甜到心里。</p>
    <button class="btn primary" id="winBtn" style="width:100%;padding:13px">再来一局 ♥</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ================= 棋盘数据 ================= */
  const CELLS = [
    {n:1, t:'起 点',           s:'起点',      k:'start', c:'gray',   mv:0},
    {n:2, t:'向前一步',         s:'前进一步',   k:'fwd',   c:'blue',   mv:1},
    {n:3, t:'继续向前一步',      s:'再进一步',   k:'fwd',   c:'blue',   mv:1},
    {n:4, t:'学猫叫三声',        s:'学猫叫三声', k:'act',   c:'teal',   mv:0},
    {n:5, t:'一起恶搞自拍',      s:'恶搞自拍',   k:'act',   c:'peach',  mv:0},
    {n:6, t:'暂停一下',         s:'暂停一下',   k:'pause', c:'yellow', mv:0},
    {n:7, t:'给对方说悄悄话',    s:'说悄悄话',   k:'act',   c:'green',  mv:0},
    {n:8, t:'后退二格',         s:'后退二格',   k:'back',  c:'pink',   mv:-2},
    {n:9, t:'给对方按小腿1分钟', s:'按小腿1分钟', k:'act',   c:'teal',   mv:0},
    {n:10,t:'对视五秒',         s:'对视五秒',   k:'act',   c:'lav',    mv:0},
    {n:11,t:'喂对方喝水',        s:'喂对方喝水', k:'act',   c:'peach',  mv:0},
    {n:12,t:'手牵手30秒',       s:'手牵手30秒', k:'act',   c:'green',  mv:0},
    {n:13,t:'后退一格',         s:'后退一格',   k:'back',  c:'pink',   mv:-1},
    {n:14,t:'拥抱30秒',         s:'拥抱30秒',   k:'act',   c:'teal',   mv:0},
    {n:15,t:'对视5秒',          s:'对视5秒',    k:'act',   c:'lav',    mv:0},
    {n:16,t:'尝试接吻的感觉',    s:'尝试接吻',   k:'act',   c:'peach',  mv:0},
    {n:17,t:'前进三格',         s:'前进三格',   k:'fwd',   c:'blue',   mv:3},
    {n:18,t:'说说初次见面的感受', s:'说说初印象', k:'act',   c:'green',  mv:0},
    {n:19,t:'手牵手一分钟',      s:'手牵手1分钟', k:'act',  c:'teal',   mv:0},
    {n:20,t:'前进三格',         s:'前进三格',   k:'fwd',   c:'blue',   mv:3},
    {n:21,t:'对方闭上眼睛给你涂口红', s:'涂口红', k:'act', c:'lav', mv:0},
    {n:22,t:'一起给对方按摩',    s:'互相按摩',   k:'act',   c:'peach',  mv:0},
    {n:23,t:'猪八戒背媳妇',      s:'八戒背', k:'act',  c:'green',  mv:0},
    {n:24,t:'后退一格',         s:'后退一格',   k:'back',  c:'pink',   mv:-1},
    {n:25,t:'摸对方耳朵2秒',    s:'摸耳朵2秒',  k:'act',   c:'teal',   mv:0},
    {n:26,t:'摸对方头10秒',     s:'摸头10秒',   k:'act',   c:'lav',    mv:0},
    {n:27,t:'暂停一下',         s:'暂停一下',   k:'pause', c:'yellow', mv:0},
    {n:28,t:'给对方唱首歌',      s:'唱首歌',     k:'act',   c:'peach',  mv:0},
    {n:29,t:'一起喝一杯水',      s:'一起喝水',   k:'act',   c:'green',  mv:0},
    {n:30,t:'尝试接吻的感觉',    s:'尝试接吻',   k:'act',   c:'lav',    mv:0},
    {n:31,t:'拍一段表白的视频做纪念', s:'表白视频', k:'act', c:'peach',  mv:0},
    {n:32,t:'后退二格',         s:'后退二格',   k:'back',  c:'pink',   mv:-2},
    {n:33,t:'给对方梳头发',      s:'梳头发',     k:'act',   c:'teal',   mv:0},
    {n:34,t:'对方站着，自己跪着喂食物', s:'跪着喂食', k:'act', c:'lav', mv:0},
    {n:35,t:'暂停一下',         s:'暂停一下',   k:'pause', c:'yellow', mv:0},
    {n:36,t:'给对方按摩捶背1分钟', s:'捶背1分钟', k:'act',   c:'green',  mv:0},
    {n:37,t:'学猫叫三声',        s:'学猫叫三声', k:'act',   c:'teal',   mv:0},
    {n:38,t:'亲吻对方手背30秒',  s:'亲手背30秒', k:'act',   c:'lav',    mv:0},
    {n:39,t:'拥抱一分钟',        s:'拥抱1分钟',  k:'act',   c:'green',  mv:0},
    {n:40,t:'后退二格',         s:'后退二格',   k:'back',  c:'pink',   mv:-2},
    {n:41,t:'对视5秒',          s:'对视5秒',    k:'act',   c:'lav',    mv:0},
    {n:42,t:'一起恶搞自拍',      s:'恶搞自拍',   k:'act',   c:'teal',   mv:0},
    {n:43,t:'重摇一次',         s:'重摇一次',   k:'reroll',c:'cream',  mv:0},
    {n:44,t:'亲吻一下对方的手',  s:'亲一下手',   k:'act',   c:'teal',   mv:0},
    {n:45,t:'【惩罚】被挠痒痒30秒', s:'被挠痒痒', k:'act', c:'peach', mv:0},
    {n:46,t:'从背后抱对方一分钟', s:'背后抱1分钟', k:'act',   c:'green',  mv:0},
    {n:47,t:'亲吻对方额头',      s:'亲额头',     k:'act',   c:'lav',    mv:0},
    {n:48,t:'后退三格',         s:'后退三格',   k:'back',  c:'pink',   mv:-3},
    {n:49,t:'浪漫表白',         s:'浪漫表白',   k:'act',   c:'peach',  mv:0},
    {n:50,t:'终 点',            s:'终点',      k:'end',   c:'gray',   mv:0}
  ];

  const PALETTE = {
    gray:'#e9e9f0', blue:'#a9d3ef', pink:'#f7bccd', yellow:'#f9e39b',
    cream:'#f7efdf', teal:'#c3e6df', green:'#cfe9c4', peach:'#fbdcc6', lav:'#e2dcf4'
  };
  const DEEP = {
    gray:'#b9b7c6', blue:'#6fa9d2', pink:'#d68fa6', yellow:'#d8bb5c',
    cream:'#c9b997', teal:'#7fbcb2', green:'#93c78d', peach:'#dba97f', lav:'#a79ccb'
  };

  const NAME = {blue:'蓝方', pink:'粉方'};
  const TOTAL = 50;

  /* ================= 布局：宽屏 11×9 / 窄屏 8×12 ================= */
  function widePos(n){
    if(n<=11) return [9, 12-n];
    if(n<=19) return [20-n, 1];
    if(n<=29) return [1, n-18];
    if(n<=35) return [n-28, 11];
    if(n<=41) return [7, 46-n];
    if(n<=45) return [48-n, 5];
    if(n<=49) return [3, n-40];
    return [3, 10];
  }
  function narrowPos(n){
    if(n<=8)  return [12, 9-n];
    if(n<=19) return [20-n, 1];
    if(n<=26) return [1, n-18];
    if(n<=36) return [n-25, 8];
    if(n<=42) return [11, 44-n];
    return [53-n, 2];
  }
  const LAY = {
    wide:   {cols:11, rows:9,  ar:11/9,      pos:widePos},
    narrow: {cols:8,  rows:12, ar:8/12.0,    pos:narrowPos}
  };

  /* ================= DOM ================= */
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), boardWrap = $('boardWrap');
  const pBlue = $('pBlue'), pPink = $('pPink');
  const dieBlue = $('dieBlue'), diePink = $('diePink');
  const cardBlue = $('cardBlue'), cardPink = $('cardPink');
  const posBlue = $('posBlue'), posPink = $('posPink');
  const turnBar = $('turnBar'), turnText = $('turnText'), tips = $('tips');
  const logEl = $('log');
  const modal = $('modal'), mTop = $('mTop'), mEmo = $('mEmo'), mTag = $('mTag'),
        mWho = $('mWho'), mTxt = $('mTxt'), mExtra = $('mExtra'), mBtn = $('mBtn');
  const winEl = $('win'), winTitle = $('winTitle'), winBtn = $('winBtn'), toastEl = $('toast');

  /* ================= 状态 ================= */
  const state = {
    turn:'blue',
    pos:{blue:1, pink:1},
    skip:{blue:false, pink:false},
    busy:false,
    over:false
  };
  let layout = 'wide';
  let cellEls = {};

  /* ================= 工具 ================= */
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  const other = p => p==='blue' ? 'pink' : 'blue';
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

  function emojiFor(c){
    const t = c.t;
    if(c.k==='start') return '🏁';
    if(c.k==='end') return '🏆';
    if(c.k==='fwd') return '⏩';
    if(c.k==='back') return '⏪';
    if(c.k==='pause') return '⏳';
    if(c.k==='reroll') return '🎲';
    if(/接吻|亲/.test(t)) return '💋';
    if(/拥抱|从背后抱/.test(t)) return '🤗';
    if(/对视/.test(t)) return '👀';
    if(/牵手/.test(t)) return '💞';
    if(/按摩|捶背|按小腿|挠痒/.test(t)) return '💆';
    if(/自拍|视频/.test(t)) return '📸';
    if(/唱/.test(t)) return '🎤';
    if(/猫叫/.test(t)) return '🐱';
    if(/喝水|喂食物/.test(t)) return '🥤';
    if(/口红/.test(t)) return '💄';
    if(/头发/.test(t)) return '💇';
    if(/悄悄话/.test(t)) return '🤫';
    if(/表白/.test(t)) return '💌';
    if(/猪八戒/.test(t)) return '🐷';
    if(/见面|感受/.test(t)) return '🫶';
    if(/耳朵/.test(t)) return '👂';
    if(/摸.*头/.test(t)) return '🫳';
    return '💗';
  }

  function fzFor(text){
    if(text.length<=4) return 1;
    if(text.length<=6) return .92;
    if(text.length<=8) return .86;
    if(text.length<=11) return .8;
    return .74;
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>toastEl.classList.remove('show'), 1700);
  }

  function addLog(msg){
    const d = document.createElement('div');
    d.className = 'li';
    d.textContent = msg;
    logEl.appendChild(d);
    while(logEl.children.length > 6) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  /* ================= 构建棋盘 ================= */
  function buildCells(){
    Object.values(cellEls).forEach(el=>el.remove());
    cellEls = {};
    const L = LAY[layout];
    boardEl.classList.toggle('wide', layout==='wide');
    boardEl.classList.toggle('narrow', layout==='narrow');
    boardEl.style.setProperty('--cols', L.cols);
    boardEl.style.setProperty('--rows', L.rows);
    boardEl.style.gridTemplateColumns = `repeat(${L.cols},minmax(0,1fr))`;
    boardEl.style.gridTemplateRows = `repeat(${L.rows},minmax(0,1fr))`;

    CELLS.forEach((c,i)=>{
      const [r,col] = L.pos(c.n);
      const el = document.createElement('div');
      el.className = 'cell';
      el.style.gridRow = r;
      el.style.gridColumn = col;
      el.style.background = PALETTE[c.c];
      el.style.setProperty('--fz', fzFor(c.t).toFixed(2));
      el.style.animationDelay = (i*9)+'ms';
      el.dataset.n = c.n;
      el.innerHTML =
        '<span class="no">'+c.n+'</span>' +
        ((c.k==='start'||c.k==='end') ? '<span class="flag">🏁</span>' : '') +
        '<span class="t-full">'+c.t+'</span>' +
        '<span class="t-short">'+c.s+'</span>';
      el.addEventListener('click', ()=>{
        if(state.over) return;
        toast('第 '+c.n+' 格 · '+c.t);
      });
      boardEl.appendChild(el);
      cellEls[c.n] = el;
    });
  }

  function fitBoard(){
    const L = LAY[layout];
    const availW = boardWrap.clientWidth || window.innerWidth - 32;
    const chrome = layout==='wide' ? 128 : 252;
    const availH = Math.max(300, window.innerHeight - chrome);
    let w = Math.min(availW, availH * L.ar);
    w = Math.max(w, 260);
    boardEl.style.width = Math.round(w) + 'px';
    boardEl.style.height = Math.round(w / L.ar) + 'px';
  }

  function sizeVars(){
    const L = LAY[layout];
    const w = boardEl.clientWidth;
    const h = boardEl.clientHeight;
    const gap = Math.max(2, w * 0.0058);
    const pad = Math.max(5, w * 0.014);
    boardEl.style.setProperty('--gap', gap.toFixed(2)+'px');
    boardEl.style.setProperty('--pad', pad.toFixed(2)+'px');
    const cw = (w - 2*pad - gap*(L.cols-1)) / L.cols;
    const ch = (h - 2*pad - gap*(L.rows-1)) / L.rows;
    boardEl.style.setProperty('--cell', Math.min(cw,ch).toFixed(2)+'px');
  }

  function syncPieces(){
    const same = state.pos.blue === state.pos.pink;
    const cell = parseFloat(getComputedStyle(boardEl).getPropertyValue('--cell')) || 40;
    const dx = same ? cell*0.22 : 0;
    placePiece(pBlue, state.pos.blue, -dx);
    placePiece(pPink, state.pos.pink, dx);
  }
  function placePiece(el, n, dx){
    const c = cellEls[n];
    if(!c) return;
    el.style.left = (c.offsetLeft + c.offsetWidth/2 + dx) + 'px';
    el.style.top  = (c.offsetTop  + c.offsetHeight/2) + 'px';
  }

  function buildLegend(){
    const items = [
      ['blue','前进'],['pink','后退'],['yellow','暂停'],['cream','重摇'],['gray','起终点']
    ];
    $('cLegend').innerHTML = items.map(([k,label])=>
      '<span class="lg"><span class="dot" style="background:'+PALETTE[k]+'"></span>'+label+'</span>'
    ).join('');
  }

  /* ================= 骰子 ================= */
  function setDie(p, v){ (p==='blue'?dieBlue:diePink).dataset.face = v; }

  /* ================= 行动 ================= */
  async function walk(player, steps, dir){
    for(let i=0;i<steps;i++){
      const cur = state.pos[player];
      const nxt = clamp(cur + dir, 1, TOTAL);
      if(nxt === cur) break;
      state.pos[player] = nxt;
      syncPieces();
      const el = player==='blue'?pBlue:pPink;
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
      await sleep(185);
    }
    updateUI();
  }

  function showCard(cell, player){
    return new Promise(resolve=>{
      mTop.style.background = 'linear-gradient(90deg,'+PALETTE[cell.c]+','+DEEP[cell.c]+')';
      mEmo.textContent = emojiFor(cell);
      mTag.textContent = '第 ' + cell.n + ' 格';
      const sw = mWho.querySelector('.swatch');
      sw.style.background = player==='blue'
        ? 'linear-gradient(150deg,#9ccdf0,#3f7fb3)'
        : 'linear-gradient(150deg,#ffc0d2,#d5658c)';
      mWho.querySelector('span:last-child').textContent = NAME[player] + ' 走到';
      mTxt.textContent = cell.t.replace(/\s/g,'');
      let ex = '';
      if(cell.mv > 0) ex = '🎯 触发：前进 ' + cell.mv + ' 格';
      else if(cell.mv < 0) ex = '🎯 触发：后退 ' + Math.abs(cell.mv) + ' 格';
      else if(cell.k === 'pause') ex = '⏸ 触发：下一回合暂停';
      else if(cell.k === 'reroll') ex = '🔄 触发：再掷一次';
      else if(cell.k === 'end') ex = '🏆 抵达终点';
      mExtra.textContent = ex;
      mExtra.style.display = ex ? 'block' : 'none';
      mBtn.textContent = cell.k === 'end' ? '太棒了 ♥' : '完成 ✓';
      modal.classList.add('show');
      mBtn.onclick = ()=>{
        modal.classList.remove('show');
        setTimeout(resolve, 180);
      };
    });
  }

  async function resolveLanding(player, depth){
    const n = state.pos[player];
    const cell = CELLS[n-1];

    if(n === TOTAL){ await showCard(cell, player); win(player); return; }

    await showCard(cell, player);

    if(depth > 8) return endTurn(player);

    if(cell.mv !== 0){
      addLog(NAME[player] + (cell.mv>0?' 前进 ':' 后退 ') + Math.abs(cell.mv) + ' 格');
      await walk(player, Math.abs(cell.mv), cell.mv>0?1:-1);
      return resolveLanding(player, depth+1);
    }

    if(cell.k === 'reroll'){
      addLog(NAME[player] + ' 重摇一次');
      state.turn = player;
      updateUI();
      tips.textContent = NAME[player] + ' 可以再掷一次 ♥';
      return;
    }

    if(cell.k === 'pause'){
      state.skip[player] = true;
      addLog(NAME[player] + ' 下一回合暂停');
    }
    endTurn(player);
  }

  async function roll(player){
    if(state.busy || state.over || state.turn !== player) return;
    state.busy = true;
    updateUI();

    const die = player==='blue' ? dieBlue : diePink;
    die.classList.add('rolling');
    for(let i=0;i<13;i++){
      setDie(player, 1 + Math.floor(Math.random()*6));
      await sleep(55);
    }
    const val = 1 + Math.floor(Math.random()*6);
    setDie(player, val);
    die.classList.remove('rolling');
    addLog(NAME[player] + ' 掷出 ' + val + ' 点');
    await sleep(240);

    await walk(player, val, 1);
    await resolveLanding(player, 0);

    state.busy = false;
    updateUI();
  }

  function endTurn(player){
    const nx = other(player);
    if(state.skip[nx]){
      state.skip[nx] = false;
      addLog(NAME[nx] + ' 暂停一回合');
      state.turn = player;
      tips.textContent = NAME[player] + ' 继续，' + NAME[nx] + ' 暂停一回合';
    }else{
      state.turn = nx;
      tips.textContent = '轮到 ' + NAME[nx] + ' 掷骰子';
    }
    updateUI();
  }

  function win(player){
    state.over = true;
    state.busy = false;
    winTitle.textContent = NAME[player] + ' 到达终点';
    winEl.classList.add('show');
    addLog('🎉 ' + NAME[player] + ' 到达终点');
    confetti();
    updateUI();
  }

  function confetti(){
    const chars = ['💗','💕','🎉','✨','💖','🌸','🎊'];
    for(let i=0;i<36;i++){
      const s = document.createElement('div');
      s.className = 'confetti';
      s.textContent = chars[Math.floor(Math.random()*chars.length)];
      s.style.left = Math.random()*100 + 'vw';
      s.style.animationDuration = (2.4 + Math.random()*2.2) + 's';
      s.style.animationDelay = (Math.random()*1.2) + 's';
      s.style.fontSize = (14 + Math.random()*18) + 'px';
      document.body.appendChild(s);
      setTimeout(()=>s.remove(), 6200);
    }
  }

  /* ================= UI 刷新 ================= */
  function updateUI(){
    posBlue.textContent = '第 ' + state.pos.blue + ' 格';
    posPink.textContent = '第 ' + state.pos.pink + ' 格';

    cardBlue.classList.toggle('active', !state.over && state.turn==='blue');
    cardPink.classList.toggle('active', !state.over && state.turn==='pink');
    cardBlue.classList.toggle('dim', state.over || state.turn!=='blue');
    cardPink.classList.toggle('dim', state.over || state.turn!=='pink');

    turnBar.classList.toggle('b', state.turn==='blue');
    turnBar.classList.toggle('p', state.turn==='pink');
    if(!state.over){
      turnText.textContent = state.busy
        ? (state.turn==='blue' ? '蓝方行动中…' : '粉方行动中…')
        : '轮到 ' + NAME[state.turn] + ' 掷骰子';
    }
  }

  /* ================= 重置 ================= */
  function reset(){
    state.turn = 'blue';
    state.pos = {blue:1, pink:1};
    state.skip = {blue:false, pink:false};
    state.busy = false;
    state.over = false;
    logEl.innerHTML = '';
    winEl.classList.remove('show');
    modal.classList.remove('show');
    setDie('blue',1); setDie('pink',1);
    tips.textContent = '轻点自己的骰子开始 ♥';
    syncPieces();
    updateUI();
    addLog('游戏开始，蓝方先手');
  }

  /* ================= 事件 ================= */
  cardBlue.addEventListener('click', ()=>roll('blue'));
  cardPink.addEventListener('click', ()=>roll('pink'));
  $('reset').addEventListener('click', reset);
  winBtn.addEventListener('click', reset);

  let rt = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(rt);
    rt = setTimeout(()=>{
      const next = window.innerWidth >= 820 ? 'wide' : 'narrow';
      if(next !== layout){
        layout = next;
        buildCells();
      }
      fitBoard();
      sizeVars();
      requestAnimationFrame(syncPieces);
    }, 140);
  });

  window.addEventListener('orientationchange', ()=>{
    setTimeout(()=>{ fitBoard(); sizeVars(); syncPieces(); }, 260);
  });

  /* ================= 启动 ================= */
  function boot(){
    layout = window.innerWidth >= 820 ? 'wide' : 'narrow';
    buildLegend();
    buildCells();
    fitBoard();
    sizeVars();
    syncPieces();
    updateUI();
    addLog('游戏开始，蓝方先手');

    // 背景漂浮爱心
    const hearts = ['💗','💕','🤍','💞','🎀'];
    for(let i=0;i<9;i++){
      const h = document.createElement('div');
      h.className = 'float-heart';
      h.textContent = hearts[i % hearts.length];
      h.style.left = (5 + Math.random()*90) + 'vw';
      h.style.animationDuration = (16 + Math.random()*14) + 's';
      h.style.animationDelay = (-Math.random()*20) + 's';
      h.style.fontSize = (12 + Math.random()*14) + 'px';
      document.body.appendChild(h);
    }

    // 等字体/图片就绪后再对位一次
    window.addEventListener('load', ()=>{ setTimeout(()=>{ sizeVars(); syncPieces(); }, 60); });
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(()=>{ sizeVars(); syncPieces(); });
    }
    setTimeout(()=>{ sizeVars(); syncPieces(); }, 300);
  }

  boot();
})();
</script>
</body>
</html>
